<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Telegram only (see extras/bin/cyberpunk-telegram): your normal font
     setup, plus Rajdhani in front of every family except monospace, so
     Telegram's interface and messages use the same face as Cyberphone.
     Emoji and anything Rajdhani lacks fall back as usual. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq"><string>monospace</string></test>
    <test qual="all" name="family" compare="not_eq"><string>Share Tech Mono</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Rajdhani</string></edit>
  </match>
</fontconfig>
